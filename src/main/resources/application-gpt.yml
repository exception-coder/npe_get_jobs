spring:
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        # Custom GptConfig owns this client; disable Spring AI's duplicate auto-configured model.
        enabled: false
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.7
          max-tokens: 2000
      embedding:
        enabled: false
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        enabled: true
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0.7
          max-tokens: 8192
          enable-search: true
    qwen:
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${QWEN_MODEL:qwen-plus}
          temperature: 0.7
          max-tokens: 8192
          enable-search: true
